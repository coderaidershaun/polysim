engine:
  hot_core_id: 3 # required on linux, ignored on macos
  tokio_workers: 2
  # The master clock. Every window length, buffer size and per-second rate derives from it,
  # so changing this rescales the whole recorder.
  spin_interval_us: 1000000
  drain_deadline_ms: 5000
  warmup_secs: 60
queues:
  input_capacity: 65536
  persistence_capacity: 65536
source:
  exchange: binance
  market: spot
  base: BTC
  quote: USDT
  kline_intervals: ["1m"]
  # Position cap in dollars. Past it that side stops quoting, so it must leave room for one full order.
  max_exposure_quote: 50
  tracker:
    # 24 hours of 1-minute candles, enough to seed the long-horizon volatility estimate.
    candles: { keep: 1440 }
    imbalance: { top_n: 5, windows: [] }
    ewma_vol: { halflife_events: 600 }
    # Measures how fast orders arrive at each distance from the best price.
    intensity: { max_depth_ticks: 32, half_life_secs: 600.0, min_events: 5.0 }
    volume_bars:
      threshold: klines
      keep: 1440
strategy:
  instruments: all
  # link_frames = what we consumed from the polymarket engine. orders + fills = the audit trail.
  tables: [features, link_frames, orders, fills]
  params:
    # Dollars per order.
    order_notional: 10
persistence:
  dir: ./data
execution:
  # Ships disarmed.
  mode: off # live, sim, off
  # To paper trade against the built-in simulator: set mode: sim and uncomment.
  # sim:
  #   order_entry_latency_ms: 15
  #   ack_latency_ms: 15
  #   max_market_data_delay_ms: 74
  #   heartbeat_ms: 100
  #   opening_base_balance: 0.01
  #   opening_quote_balance: 1000.0
  #   # Binance spot VIP0 with the BNB 25% discount on BTCUSDT (base tier is 10, no-BNB).
  #   # Zero maker exists but not on this pair for this account: the spot market-maker
  #   # programme needs ~$25M weekly maker volume, and the zero-fee promos are FDUSD/USDC pairs.
  #   maker_fee_bps: 7.5
  max_orders_per_side: 1
  # Don't move an order for less than this. Moving it loses our place in the queue.
  requote_threshold_ticks: 1
  # Balances held back and never traded through. Both must be above zero.
  min_base_balance: 0.0002
  min_quote_balance: 20.0
  # Ceiling on one order. Leaves room above order_notional while still catching a sizing bug.
  max_order_notional_quote: 25.0
  # How far from mid a quote may sit.
  max_quote_distance_bps: 50.0
  # Book older than this means the engine is flying blind, so it pulls its quotes.
  max_book_age_ms: 2000
  # Rejects in a row before the kill switch. Ordinary post-only crosses don't count.
  max_consecutive_rejects: 5
  # Loss budget for the run. A realised breach halts; unrealised only stops adding to a position.
  max_session_loss_quote: 5.0
  inflight_timeout_ms: 5000
  # Binance's stream key can expire and go quiet without saying so. No exec events for this many
  # spins -> reconnect.
  exec_silence_spins: 30
  # How long to remember closed orders. Must outlast the venue resending them.
  order_reap_secs: 60
  recv_window_ms: 5000
  # Checked once at startup. A clock further off than this and the venue rejects everything.
  max_clock_skew_ms: 1000
  # Venue unreachable this long -> pull any resting orders.
  disconnect_sweep_secs: 30
link:
  # Loopback: this engine and the workstation share a box. Private network only.
  bind: "127.0.0.1:9310"
  # hold = keep running and warn if the workstation vanishes. idle = dead-man switch, for
  # unattended trading.
  on_controller_loss: hold
  # The polymarket engine publishes poly_up on 9311. Name the topic rather than take everything.
  subscribe:
    - address: "127.0.0.1:9311"
      topics: [poly_up]
logging:
  dir: ./logs
