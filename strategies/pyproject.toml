[project]
name = "post-trade"
version = "0.1.0"
description = "post-trade notebooks over the parquet a strategy run records"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "polars>=1.42.1",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
]

[dependency-groups]
dev = [
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]
